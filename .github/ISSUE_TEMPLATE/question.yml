name: Question
description: Ask how something is meant to work
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `examples/saga-reader/` is a complete render of every file the pack
        produces, and it answers most "what should this look like?" questions directly.

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool are you using?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor
        - Antigravity
        - "Not tool-specific"

name: CI

on:
  # Every PR, so a contributor's first push gets feedback.
  pull_request:
  # And direct pushes to main, so "main is green" is a real signal rather than
  # an assumption that nobody bypassed review.
  push:
    branches: [main]

# Supersede in-flight runs for the same ref: the latest commit's status is the
# only one anyone reads. `github.ref` is a controlled value (refs/heads/* or
# refs/pull/*/merge), not user input, so interpolating it is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # test.sh is the whole build. It needs bash, grep, sed, and jq, and runs in
  # seconds — so run it on both OSes the pack is actually installed on. The
  # installer and hook checks write into a throwaway HOME and are the ones most
  # likely to behave differently on macOS (BSD userland, different bash).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Versions
        run: |
          bash --version | head -1
          jq --version

      - name: Run the integrity linter
        run: ./test.sh

  # The installer is the one thing test.sh cannot fully cover from inside the
  # repo: it links into $HOME for four tools, and a target whose config dir is
  # absent must be skipped cleanly rather than failing. test.sh covers the
  # present-tool case against a throwaway HOME; this covers the bare-HOME case
  # and the full round trip.
  install-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install into a HOME with no tools present
        run: |
          H="$(mktemp -d)"
          HOME="$H" ./install.sh --yes
          echo "--- nothing should have been created ---"
          find "$H" -mindepth 1 | sed 's/^/  /' || true

      - name: Install, re-install, and uninstall with all four tools present
        run: |
          H="$(mktemp -d)"
          mkdir -p "$H/.claude" "$H/.codex" "$H/.cursor" "$H/.gemini/antigravity-cli"
          HOME="$H" ./install.sh --yes
          before="$(find "$H" | sort | cksum)"
          HOME="$H" ./install.sh --yes
          after="$(find "$H" | sort | cksum)"
          [ "$before" = "$after" ] || { echo "install.sh is not idempotent"; exit 1; }
          HOME="$H" ./install.sh --uninstall
          left="$(find "$H" -type l | wc -l | tr -d ' ')"
          [ "$left" = "0" ] || { echo "uninstall left $left symlink(s) behind"; find "$H" -type l; exit 1; }
